<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Campaign — Character Picker</title>
    <meta name="description" content="Choose your character for the campaign.">
    <link rel="stylesheet" href="app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <h1 id="header-title">Campaign Title</h1>
    <p id="header-subtitle" class="subtitle">Choose your character</p>
</header>

<main>

    <!-- ── Player Gallery ── -->
    <section id="gallery-view" class="view">
        <p class="instructions">Tap a character card to read the full sheet and claim your role.</p>
        <div id="character-grid" class="grid"></div>
    </section>

</main>

<!-- ── Character Detail Modal ── -->
<div id="character-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-char-name">
    <div class="modal-content">
        <button class="modal-close" id="close-modal" aria-label="Close">✕</button>
        <div class="modal-portrait" id="modal-portrait"></div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<footer class="site-footer">
    <a href="gm.html" class="secret-btn" aria-label="GM access" title="GM access" style="text-decoration:none;">⚙</a>
</footer>

<!-- Firebase compat SDK (no build step required) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
